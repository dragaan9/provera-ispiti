name: Provera OE2 Rezultata

on:
  schedule:
    # Pokreće se na svakih 15 minuta (cron sintaksa)
    - cron: '*/15 * * * *'
  # Omogućava ručno pokretanje na klik u GitHub sučelju
  workflow_dispatch:

jobs:
  check-website:
    runs-on: ubuntu-latest
    steps:
      - name: Preuzmi kod iz repozitorijuma
        uses: actions/checkout@v4

      - name: Podesi Python okruženje
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instaliraj biblioteke
        run: pip install -r requirements.txt

      - name: Pokreni skriptu
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python oet.py
